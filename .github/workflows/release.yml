name: Publish to npm

on:
  # Called from release-please.yml after a Release PR is merged.
  workflow_call:
  # Manual escape hatch for re-publishing the current main, e.g. if a
  # publish job failed transiently. Use sparingly — the canonical path
  # is via release-please.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - run: pnpm test

      - run: pnpm run build

      - run: npm install -g npm@latest

      - run: npm publish --provenance --access public
